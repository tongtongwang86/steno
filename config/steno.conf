# Steno firmware config.
#
# Deliberately does NOT set CONFIG_ZMK_DISPLAY: it does `select LVGL`, which
# is non-overridable and costs ~118 KB of flash - it does not fit alongside
# the dictionary. The board uses its own framebuffer driver instead
# (CONFIG_STENO_DISPLAY, set in the board defconfig).

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y

# Uncomment for engine/dictionary logs over USB CDC.
# CONFIG_STENO_ZMK_LOG_LEVEL_DBG=y
# CONFIG_STENO_DICT_LOG_LEVEL_INF=y
